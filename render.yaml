# Servidor de juego en Render (docs/DEPLOY.md). La web va en Vercel (vercel.json).
services:
  - type: web
    name: atacknimal-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace @atacknimal/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Dominio de la web en Vercel, por ejemplo https://atacknimal.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Sin DATABASE_URL: almacén en memoria (PGlite no cabe en los 512 MB del plan gratuito).
      - key: DB_DRIVER
        value: memory
      # Opcional: PostgreSQL (Neon). Con valor, se usa en lugar del almacén en memoria.
      - key: DATABASE_URL
        sync: false
